<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Schedule</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://a.espncdn.com" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #22262f;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --live: #f28b82;
      --final: #81c995;
      --win: #81c995;
      --loss: #f28b82;
      --rank: #fdd663;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 20px 40px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .nav a {
      text-decoration: none;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav a:hover {
      color: var(--text);
      border-color: #3a4050;
    }

    .team-hero {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 22px;
    }

    .hero-logo {
      width: 72px;
      height: 72px;
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .hero-meta h2 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .hero-meta p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .hero-meta .record {
      color: var(--text);
      font-weight: 700;
    }

    .schedule-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .schedule-head {
      display: none;
      grid-template-columns: 56px 90px minmax(0, 1.4fr) minmax(0, 1fr) 90px 130px;
      gap: 12px;
      padding: 10px 16px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #151821;
    }

    .week-divider {
      padding: 10px 16px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: #14171e;
      border-top: 1px solid var(--border);
    }

    .week-divider:first-child {
      border-top: none;
    }

    .game {
      display: grid;
      grid-template-columns: 56px 72px minmax(0, 1fr);
      gap: 10px 12px;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s ease;
    }

    .game:hover {
      background: var(--card-hover);
    }

    .result-pill {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .result-pill.W { background: rgba(129, 201, 149, 0.18); color: var(--win); }
    .result-pill.L { background: rgba(242, 139, 130, 0.18); color: var(--loss); }
    .result-pill.T { background: #2a2f3a; color: var(--muted); }
    .result-pill.live {
      background: rgba(242, 139, 130, 0.18);
      color: var(--live);
      font-size: 0.58rem;
      letter-spacing: 0.03em;
    }
    .result-pill.pre {
      background: #2a2f3a;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .ha {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .opp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .opp-logo {
      width: 32px;
      height: 32px;
      background: #fff;
      border-radius: 6px;
      padding: 2px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .opp-name {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-mobile {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-size: 0.78rem;
      color: var(--muted);
      padding-top: 2px;
    }

    .meta-desktop {
      display: none;
      font-size: 0.82rem;
      color: var(--muted);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-side {
      text-align: right;
      font-variant-numeric: tabular-nums;
      justify-self: end;
    }

    .score-side .score {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .score-side .when {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .empty, .error {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      background: #3c1f1f;
      border: 1px solid #5c2b2b;
      border-radius: 10px;
      color: #f28b82;
    }

    footer {
      margin-top: 22px;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }

    @media (min-width: 800px) {
      body {
        padding: 24px 32px 48px;
      }

      .schedule-head {
        display: grid;
      }

      .game {
        grid-template-columns: 56px 90px minmax(0, 1.4fr) minmax(0, 1fr) 90px 130px;
        padding: 14px 16px;
      }

      .meta-mobile {
        display: none;
      }

      .meta-desktop {
        display: block;
      }

      .score-side .score {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Team Schedule</h1>
    </header>

    <nav class="nav" aria-label="Site">
      <a href="index.html">Scores</a>
      <a href="watch.html">Watch Guide</a>
      <a href="results.html">Results</a>
    </nav>

    <div id="content"><div class="empty">Loading schedule…</div></div>
    <footer>Season schedule via ESPN · Click a game for Gamecast / Box Score</footer>
  </div>

  <script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(location.search);
    const teamId = params.get("id");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /** ESPN schedule scores are often { value, displayValue } */
    function scoreText(score) {
      if (score == null || score === "") return null;
      if (typeof score === "object") {
        if (score.displayValue != null && score.displayValue !== "") return String(score.displayValue);
        if (score.value != null && score.value !== "") return String(score.value);
        return null;
      }
      return String(score);
    }

    function gameHref(event, state) {
      const links = event.links || [];
      if (state === "post") {
        const box = links.find(l => (l.rel || []).includes("boxscore") || l.text === "Box Score");
        if (box) return box.href;
        return `https://www.espn.com/college-football/boxscore/_/gameId/${event.id}`;
      }
      const live = links.find(l => (l.rel || []).includes("live") || l.text === "Gamecast");
      if (live) return live.href;
      return `https://www.espn.com/college-football/game?gameId=${event.id}`;
    }

    function formatWhen(event, status) {
      const state = status?.type?.state || "pre";
      if (state === "in") return status.type.shortDetail || status.type.detail || "Live";
      if (state === "post") return "Final";
      const d = new Date(event.date);
      if (Number.isNaN(d.getTime())) return status?.type?.shortDetail || "";
      const dateStr = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      return `${dateStr} · ${timeStr}`;
    }

    function render(data) {
      const team = data.team || {};
      const events = data.events || [];
      const logo = team.logo || `https://a.espncdn.com/i/teamlogos/ncaa/500/${team.id}.png`;
      const record = team.recordSummary || "";
      const standing = team.standingSummary || "";

      document.title = `${team.displayName || "Team"} Schedule`;

      let html = `
        <div class="team-hero">
          <img class="hero-logo" src="${logo}" alt="" />
          <div class="hero-meta">
            <h2>${escapeHtml(team.displayName || "Team")}</h2>
            <p>
              ${record ? `<span class="record">${escapeHtml(record)}</span>` : ""}
              ${record && standing ? " · " : ""}
              ${standing ? escapeHtml(standing) : ""}
            </p>
          </div>
        </div>
      `;

      if (!events.length) {
        html += `<div class="empty">No games found for this team.</div>`;
        content.innerHTML = html;
        return;
      }

      html += `<div class="schedule-wrap">`;
      html += `
        <div class="schedule-head">
          <div>Result</div>
          <div>Home/Away</div>
          <div>Opponent</div>
          <div>Details</div>
          <div style="text-align:right">Score</div>
          <div style="text-align:right">When</div>
        </div>
      `;

      let lastWeek = null;
      for (const event of events) {
        const comp = event.competitions?.[0];
        if (!comp) continue;
        const status = comp.status || {};
        const state = status.type?.state || "pre";
        const weekText = event.week?.text || (event.week?.number != null ? `Week ${event.week.number}` : "Season");

        if (weekText !== lastWeek) {
          html += `<div class="week-divider">${escapeHtml(weekText)}</div>`;
          lastWeek = weekText;
        }

        const competitors = comp.competitors || [];
        const self = competitors.find(c => String(c.id) === String(teamId) || String(c.team?.id) === String(teamId));
        const opp = competitors.find(c => c !== self) || competitors.find(c => String(c.team?.id) !== String(teamId));

        const ha = self?.homeAway === "home" ? "Home" : self?.homeAway === "away" ? "Away" : "Neutral";
        const haShort = self?.homeAway === "home" ? "vs" : self?.homeAway === "away" ? "@" : "vs";
        const oppTeam = opp?.team || {};
        const oppLogo = (oppTeam.logos && oppTeam.logos[0]?.href) ||
          (oppTeam.id ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${oppTeam.id}.png` : "");
        const oppName = oppTeam.displayName || oppTeam.shortDisplayName || oppTeam.abbreviation || "TBD";

        let pill = `<span class="result-pill pre">–</span>`;
        let scoreLine = "—";
        const sSelf = scoreText(self?.score);
        const sOpp = scoreText(opp?.score);

        if (state === "in") {
          pill = `<span class="result-pill live">LIVE</span>`;
          if (sSelf != null && sOpp != null) scoreLine = `${sSelf}–${sOpp}`;
        } else if (state === "post") {
          const won = self?.winner === true;
          const lost = self?.winner === false;
          const letter = won ? "W" : lost ? "L" : "T";
          pill = `<span class="result-pill ${letter}">${letter}</span>`;
          if (sSelf != null && sOpp != null) scoreLine = `${sSelf}–${sOpp}`;
        }

        const venue = comp.venue?.fullName
          ? `${comp.venue.fullName}${comp.venue.address?.city ? ", " + comp.venue.address.city : ""}`
          : "";
        const network = (comp.broadcasts || []).flatMap(b => b.names || [])[0] || "";
        const details = [network, venue].filter(Boolean).join(" · ") || "—";
        const when = formatWhen(event, status);

        html += `
          <a class="game" href="${gameHref(event, state)}" target="_blank" rel="noopener">
            <div>${pill}</div>
            <div class="ha">${haShort} <span style="color:var(--muted);font-weight:500">(${ha})</span></div>
            <div class="opp-row">
              ${oppLogo ? `<img class="opp-logo" src="${oppLogo}" alt="" loading="lazy" />` : ""}
              <div class="opp-name">${escapeHtml(oppName)}</div>
            </div>
            <div class="meta-desktop" title="${escapeHtml(details)}">${escapeHtml(details)}</div>
            <div class="score-side">
              <div class="score">${escapeHtml(scoreLine)}</div>
            </div>
            <div class="score-side">
              <div class="when">${escapeHtml(when)}</div>
            </div>
            <div class="meta-mobile">
              <span>${escapeHtml(when)}</span>
              ${network ? `<span>${escapeHtml(network)}</span>` : ""}
              ${venue ? `<span>${escapeHtml(venue)}</span>` : ""}
            </div>
          </a>
        `;
      }

      html += `</div>`;
      content.innerHTML = html;
    }

    async function load() {
      if (!teamId) {
        content.innerHTML = `<div class="error">Missing team id. Open a team from the Scores page.</div>`;
        return;
      }
      try {
        const url = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/${encodeURIComponent(teamId)}/schedule`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (err) {
        content.innerHTML = `<div class="error">Failed to load schedule. ${escapeHtml(err.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
