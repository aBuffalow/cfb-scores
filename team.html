<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Schedule</title>
  <link rel="preconnect" href="https://a.espncdn.com" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #22262f;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --live: #f28b82;
      --final: #81c995;
      --upcoming: #8ab4f8;
      --rank: #fdd663;
      --win: #81c995;
      --loss: #f28b82;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 16px 32px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .nav a {
      text-decoration: none;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .nav a:hover { color: var(--text); border-color: #3a4050; }
    .team-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .hero-logo {
      width: 56px;
      height: 56px;
      background: #fff;
      border-radius: 10px;
      padding: 4px;
      object-fit: contain;
    }
    .hero-meta h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .hero-meta p {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .hero-meta .record {
      color: var(--text);
      font-weight: 600;
    }
    .week-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .game {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 10px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    a.game:hover {
      background: var(--card-hover);
      border-color: #3a4050;
    }
    .result-pill {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-pill.W { background: rgba(129,201,149,0.2); color: var(--win); }
    .result-pill.L { background: rgba(242,139,130,0.2); color: var(--loss); }
    .result-pill.T { background: #2a2f3a; color: var(--muted); }
    .result-pill.live { background: rgba(242,139,130,0.2); color: var(--live); font-size: 0.6rem; }
    .result-pill.pre { background: #2a2f3a; color: var(--muted); font-size: 0.65rem; }
    .ha {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .opp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .opp-logo {
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 5px;
      padding: 2px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .opp-name {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .opp-sub {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .score-side {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .score-side .score {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .score-side .when {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .empty, .error {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .error {
      background: #3c1f1f;
      border: 1px solid #5c2b2b;
      border-radius: 10px;
      color: #f28b82;
    }
    footer {
      margin-top: 20px;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Team Schedule</h1>
  </header>

  <nav class="nav" aria-label="Site">
    <a href="index.html">Scores</a>
    <a href="watch.html">Watch Guide</a>
    <a href="results.html">Results</a>
  </nav>

  <div id="content"><div class="empty">Loading schedule…</div></div>
  <footer>Season schedule via ESPN · Tap a game for Gamecast / Box Score</footer>

  <script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(location.search);
    const teamId = params.get("id");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function gameHref(event, state) {
      const links = event.links || [];
      if (state === "post") {
        const box = links.find(l => (l.rel || []).includes("boxscore") || l.text === "Box Score");
        if (box) return box.href;
        return `https://www.espn.com/college-football/boxscore/_/gameId/${event.id}`;
      }
      const live = links.find(l => (l.rel || []).includes("live") || l.text === "Gamecast");
      if (live) return live.href;
      return `https://www.espn.com/college-football/game?gameId=${event.id}`;
    }

    function formatWhen(event, status) {
      const state = status?.type?.state || "pre";
      if (state === "in") return status.type.shortDetail || status.type.detail || "Live";
      if (state === "post") return "Final";
      const d = new Date(event.date);
      if (Number.isNaN(d.getTime())) return status?.type?.shortDetail || "";
      const dateStr = d.toLocaleDateString([], { month: "short", day: "numeric" });
      const timeStr = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      return `${dateStr} · ${timeStr}`;
    }

    function render(data) {
      const team = data.team || {};
      const events = data.events || [];
      const logo = team.logo || `https://a.espncdn.com/i/teamlogos/ncaa/500/${team.id}.png`;
      const record = team.recordSummary || "";
      const standing = team.standingSummary || "";

      document.title = `${team.displayName || "Team"} Schedule`;

      let html = `
        <div class="team-hero">
          <img class="hero-logo" src="${logo}" alt="" />
          <div class="hero-meta">
            <h2>${escapeHtml(team.displayName || "Team")}</h2>
            <p>
              ${record ? `<span class="record">${escapeHtml(record)}</span>` : ""}
              ${record && standing ? " · " : ""}
              ${standing ? escapeHtml(standing) : ""}
            </p>
          </div>
        </div>
      `;

      if (!events.length) {
        html += `<div class="empty">No games found for this team.</div>`;
        content.innerHTML = html;
        return;
      }

      let lastWeek = null;
      for (const event of events) {
        const comp = event.competitions?.[0];
        if (!comp) continue;
        const status = comp.status || {};
        const state = status.type?.state || "pre";
        const weekText = event.week?.text || (event.week?.number != null ? `Week ${event.week.number}` : "Season");

        if (weekText !== lastWeek) {
          html += `<div class="week-label">${escapeHtml(weekText)}</div>`;
          lastWeek = weekText;
        }

        const competitors = comp.competitors || [];
        const self = competitors.find(c => String(c.id) === String(teamId) || String(c.team?.id) === String(teamId));
        const opp = competitors.find(c => c !== self) || competitors.find(c => String(c.team?.id) !== String(teamId));

        const ha = self?.homeAway === "home" ? "vs" : self?.homeAway === "away" ? "@" : "vs";
        const oppTeam = opp?.team || {};
        const oppLogo = (oppTeam.logos && oppTeam.logos[0]?.href) ||
          (oppTeam.id ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${oppTeam.id}.png` : "");
        const oppName = oppTeam.displayName || oppTeam.shortDisplayName || oppTeam.abbreviation || "TBD";

        let pill = `<span class="result-pill pre">–</span>`;
        let scoreText = "";
        if (state === "in") {
          pill = `<span class="result-pill live">LIVE</span>`;
          const sSelf = self?.score ?? "–";
          const sOpp = opp?.score ?? "–";
          scoreText = `${sSelf}–${sOpp}`;
        } else if (state === "post") {
          const won = self?.winner === true;
          const lost = self?.winner === false;
          const letter = won ? "W" : lost ? "L" : "T";
          pill = `<span class="result-pill ${letter}">${letter}</span>`;
          const sSelf = self?.score ?? "–";
          const sOpp = opp?.score ?? "–";
          scoreText = `${sSelf}–${sOpp}`;
        }

        const venue = comp.venue?.fullName
          ? `${comp.venue.fullName}${comp.venue.address?.city ? " · " + comp.venue.address.city : ""}`
          : "";
        const network = (comp.broadcasts || []).flatMap(b => b.names || [])[0] || "";
        const sub = [network, venue].filter(Boolean).join(" · ");

        html += `
          <a class="game" href="${gameHref(event, state)}" target="_blank" rel="noopener">
            <div>
              ${pill}
              <div class="ha">${ha}</div>
            </div>
            <div class="opp-row">
              ${oppLogo ? `<img class="opp-logo" src="${oppLogo}" alt="" loading="lazy" />` : ""}
              <div style="min-width:0">
                <div class="opp-name">${escapeHtml(oppName)}</div>
                ${sub ? `<div class="opp-sub">${escapeHtml(sub)}</div>` : ""}
              </div>
            </div>
            <div class="score-side">
              ${scoreText ? `<div class="score">${scoreText}</div>` : ""}
              <div class="when">${escapeHtml(formatWhen(event, status))}</div>
            </div>
          </a>
        `;
      }

      content.innerHTML = html;
    }

    async function load() {
      if (!teamId) {
        content.innerHTML = `<div class="error">Missing team id. Open a team from the Scores page.</div>`;
        return;
      }
      try {
        const url = `https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/${encodeURIComponent(teamId)}/schedule`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
      } catch (err) {
        content.innerHTML = `<div class="error">Failed to load schedule. ${escapeHtml(err.message)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
