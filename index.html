<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFB Scores</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://a.espncdn.com" />
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #22262f;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --live: #f28b82;
      --final: #81c995;
      --upcoming: #8ab4f8;
      --rank: #fdd663;
      --poss: #b8ff4a;
      --score-flash: #81c995;
      --redzone: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 16px 32px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }


    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .nav a {
      text-decoration: none;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .nav a:hover { color: var(--text); border-color: #3a4050; }
    .nav a.active {
      color: var(--text);
      border-color: #4a6fa5;
      background: #1a2332;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .controls label {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    select:hover, button:hover {
      background: var(--card-hover);
    }

    button.toggle-on {
      background: #1a2e22;
      border-color: #3d6b4f;
      color: #81c995;
    }

    .status.starting-soon {
      color: #fdd663;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-bar {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.live {
      background: var(--live);
      box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.5);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.5); }
      70% { box-shadow: 0 0 0 6px rgba(242, 139, 130, 0); }
      100% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0); }
    }

    @keyframes scorePop {
      0% {
        transform: scale(1);
        color: var(--text);
        text-shadow: none;
      }
      25% {
        transform: scale(1.35);
        color: var(--score-flash);
        text-shadow: 0 0 12px rgba(129, 201, 149, 0.8);
      }
      60% {
        transform: scale(1.15);
        color: var(--score-flash);
      }
      100% {
        transform: scale(1);
        color: var(--text);
        text-shadow: none;
      }
    }

    .score.just-scored {
      animation: scorePop 1.4s ease-out;
    }

    .card.scored-flash {
      animation: cardGlow 1.6s ease-out;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); border-color: var(--border); }
      20% { box-shadow: 0 0 0 2px rgba(129, 201, 149, 0.55); border-color: rgba(129, 201, 149, 0.7); }
      100% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); border-color: var(--border); }
    }

    .card.live.scored-flash {
      animation: cardGlowLive 1.6s ease-out;
    }

    @keyframes cardGlowLive {
      0% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); border-color: rgba(100, 210, 255, 0.55); }
      20% { box-shadow: 0 0 0 2px rgba(129, 201, 149, 0.55); border-color: rgba(129, 201, 149, 0.7); }
      100% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); border-color: rgba(100, 210, 255, 0.55); }
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .section-title.collapsible {
      cursor: pointer;
      user-select: none;
      width: fit-content;
    }

    .section-title.collapsible:hover {
      color: var(--text);
    }

    .section-title .chevron {
      font-size: 0.7rem;
      transition: transform 0.15s ease;
      display: inline-block;
    }

    .section.collapsed .section-title .chevron {
      transform: rotate(-90deg);
    }

    .section.collapsed .grid {
      display: none;
    }

    /* Expand cards when a section has only 1–2 games */
    .grid:has(> .card:only-child) {
      grid-template-columns: minmax(290px, 560px);
    }

    .grid:has(> .card:nth-child(1):nth-last-child(2)) {
      grid-template-columns: repeat(2, minmax(290px, 1fr));
      max-width: 920px;
    }

    .expanded-panel {
      display: none;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      flex-direction: column;
      gap: 8px;
    }

    .grid:has(> .card:only-child) .expanded-panel,
    .grid:has(> .card:nth-child(1):nth-last-child(2)) .expanded-panel {
      display: flex;
    }

    .qtr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
    }

    .qtr-table th,
    .qtr-table td {
      padding: 3px 6px;
      text-align: center;
    }

    .qtr-table th {
      color: var(--muted);
      font-weight: 600;
    }

    .qtr-table td.team-cell {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      padding-left: 0;
    }

    .qtr-table td.total-cell {
      font-weight: 700;
      color: var(--text);
    }

    .extra-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      font-size: 0.72rem;
      color: var(--muted);
      align-items: center;
    }

    .extra-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .wp-bar {
      flex: 1;
      min-width: 120px;
      height: 8px;
      background: #2a2f3a;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }

    .wp-bar .away-wp {
      background: #8ab4f8;
      height: 100%;
    }

    .wp-bar .home-wp {
      background: #f28b82;
      height: 100%;
    }

    .timeout-dots {
      letter-spacing: 2px;
      color: var(--poss);
    }

    .timeout-dots .used {
      color: #3a4050;
    }

    .section-title .count {
      background: #2a2f3a;
      color: var(--text);
      font-size: 0.7rem;
      padding: 1px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    .section-title.live-title { color: var(--live); }
    .section-title.final-title { color: var(--final); }
    .section-title.upcoming-title { color: var(--upcoming); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px 11px;
      transition: background 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: #3a4050;
    }

    .cast-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .cast-link:hover {
      text-decoration: underline;
    }

    .card.live {
      border-color: rgba(100, 210, 255, 0.55);
    }

    .card.redzone {
      border-color: rgba(255, 107, 107, 0.75);
      background: linear-gradient(180deg, rgba(255, 107, 107, 0.1) 0%, var(--card) 40%);
    }

    /* Live + red zone: keep red zone dominant */
    .card.live.redzone {
      border-color: rgba(255, 107, 107, 0.85);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--muted);
      gap: 8px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .rz-badge {
      background: var(--redzone);
      color: #1a1d24;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .status {
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status.in { color: var(--live); }
    .status.post { color: var(--final); }
    .status.pre { color: var(--upcoming); }

    .network {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48%;
      text-align: right;
    }

    .teams {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 8px;
    }

    .logo-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: #ffffff;
      padding: 2px;
      flex-shrink: 0;
    }

    .logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }

    .logo.fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      color: #333;
      background: #e8eaed;
      width: 26px;
      height: 26px;
      border-radius: 3px;
    }

    .team-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .team-name {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .team-link {
      color: inherit;
      text-decoration: none;
    }
    .team-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--rank);
      flex-shrink: 0;
    }

    .record {
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      margin-left: 2px;
    }

    .score-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      min-width: 2.2em;
    }

    .score {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      display: inline-block;
    }

    .score.winner { color: #fff; }
    .score.loser { color: var(--muted); }

    .poss-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--poss);
      box-shadow: 0 0 8px rgba(184, 255, 74, 0.85);
      flex-shrink: 0;
    }

    .poss-spacer {
      width: 8px;
      flex-shrink: 0;
    }

    .situation {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(138, 180, 248, 0.08);
      border-radius: 5px;
      padding: 4px 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
    }

    .situation.redzone {
      color: #ffb4b4;
      background: rgba(255, 107, 107, 0.12);
    }

    .situation .ball {
      color: var(--poss);
      font-weight: 600;
    }


    .mini-field {
      margin-top: 2px;
      padding: 4px 0 2px;
    }

    .mini-field-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: var(--muted);
      margin-bottom: 3px;
      letter-spacing: 0.02em;
    }

    .field-track {
      position: relative;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(90deg, #14532d 0%, #166534 10%, #15803d 50%, #166534 90%, #14532d 100%);
      border: 1px solid #4ade80;
      overflow: hidden;
    }

    .mini-field-mid {
      color: var(--text);
      font-weight: 600;
      font-size: 0.65rem;
    }

    .field-track::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, transparent 0, transparent calc(10% - 0.5px), rgba(255,255,255,0.12) calc(10% - 0.5px), rgba(255,255,255,0.12) calc(10% + 0.5px), transparent calc(10% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(20% - 0.5px), rgba(255,255,255,0.12) calc(20% - 0.5px), rgba(255,255,255,0.12) calc(20% + 0.5px), transparent calc(20% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(30% - 0.5px), rgba(255,255,255,0.12) calc(30% - 0.5px), rgba(255,255,255,0.12) calc(30% + 0.5px), transparent calc(30% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(40% - 0.5px), rgba(255,255,255,0.12) calc(40% - 0.5px), rgba(255,255,255,0.12) calc(40% + 0.5px), transparent calc(40% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(50% - 0.5px), rgba(255,255,255,0.22) calc(50% - 0.5px), rgba(255,255,255,0.22) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(60% - 0.5px), rgba(255,255,255,0.12) calc(60% - 0.5px), rgba(255,255,255,0.12) calc(60% + 0.5px), transparent calc(60% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(70% - 0.5px), rgba(255,255,255,0.12) calc(70% - 0.5px), rgba(255,255,255,0.12) calc(70% + 0.5px), transparent calc(70% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(80% - 0.5px), rgba(255,255,255,0.12) calc(80% - 0.5px), rgba(255,255,255,0.12) calc(80% + 0.5px), transparent calc(80% + 0.5px)),
        linear-gradient(90deg, transparent 0, transparent calc(90% - 0.5px), rgba(255,255,255,0.12) calc(90% - 0.5px), rgba(255,255,255,0.12) calc(90% + 0.5px), transparent calc(90% + 0.5px));
      pointer-events: none;
    }

    .field-endzone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6%;
      background: rgba(0,0,0,0.25);
    }

    .field-endzone.left { left: 0; border-right: 1px solid rgba(255,255,255,0.15); }
    .field-endzone.right { right: 0; border-left: 1px solid rgba(255,255,255,0.15); }

    .field-drive {
      position: absolute;
      top: 3px;
      bottom: 3px;
      background: rgba(184, 255, 74, 0.35);
      border-radius: 2px;
      min-width: 2px;
      pointer-events: none;
    }

    .field-ball {
      position: absolute;
      top: 50%;
      width: 11px;
      height: 11px;
      margin-top: -5.5px;
      margin-left: -5.5px;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.85), 0 0 2px #000;
      border: 2px solid var(--poss);
      z-index: 2;
      pointer-events: none;
    }

    .field-start {
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 2px;
      margin-left: -1px;
      background: rgba(255,255,255,0.55);
      z-index: 1;
      pointer-events: none;
    }

    .last-play {
      font-size: 0.7rem;
      color: var(--muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .last-play strong {
      color: #c5c9d0;
      font-weight: 600;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--muted);
      gap: 8px;
      margin-top: 1px;
    }

    .spread {
      font-variant-numeric: tabular-nums;
    }

    .spread .fav {
      color: var(--text);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .error {
      grid-column: 1 / -1;
      background: #3c1f1f;
      border: 1px solid #5c2b2b;
      border-radius: 10px;
      padding: 16px;
      color: #f28b82;
      font-size: 0.9rem;
    }

    .hide-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
      z-index: 2;
      padding: 0;
    }

    .card:hover .hide-btn,
    .hide-btn:focus {
      opacity: 1;
    }

    .hide-btn:hover {
      background: #2a2f3a;
      color: var(--text);
    }

    .hidden-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hidden-bar[hidden] {
      display: none;
    }

    .hidden-bar button {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .hidden-bar button:hover {
      border-color: #4a5160;
    }

    footer {
      margin-top: 12px;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px 10px 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>College Football Scores</h1>
    <div class="controls">
      <button id="watchableToggle" title="Sort live games by how watchable they are (close, ranked, late)">Watchable sort</button>
      <button id="refresh" title="Refresh now">↻ Refresh</button>
      <div class="status-bar">
        <span class="dot" id="liveDot"></span>
        <span id="updated">Loading…</span>
      </div>
    </div>
  </header>

  <nav class="nav" aria-label="Site">
    <a href="index.html" class="active">Scores</a>
    <a href="watch.html">Watch Guide</a>
    <a href="results.html">Results</a>
  </nav>

  <div class="hidden-bar" id="hiddenBar" hidden>
    <span id="hiddenCount">0 games hidden</span>
    <button type="button" id="showAllHidden">Show all</button>
  </div>

  <div id="content">
    <div class="empty">Loading scores…</div>
  </div>

  <footer>
    Data via ESPN · Auto-refreshes every 15s · Gamecast / Box Score links on each card
  </footer>

  <script>
    const content = document.getElementById("content");
    const updatedEl = document.getElementById("updated");
    const liveDot = document.getElementById("liveDot");
        const refreshBtn = document.getElementById("refresh");

    let timer = null;
    const REFRESH_MS = 15000;

    // gameId -> { teamId: score }
    const prevScores = new Map();
    // `${gameId}-${teamId}` -> timestamp
    const recentScores = new Map();
    // gameId -> card element (preserves logos across refreshes)
    const cardEls = new Map();
    let forceFullRender = true;
    let watchableSortOn = localStorage.getItem("cfb-watchable-sort") === "1";

    // Temporarily hidden games (session only — avoid spoilers on delayed streams)
    const HIDDEN_KEY = "cfb-hidden-games";
    const hiddenGames = new Set(JSON.parse(sessionStorage.getItem(HIDDEN_KEY) || "[]"));

    function persistHidden() {
      sessionStorage.setItem(HIDDEN_KEY, JSON.stringify([...hiddenGames]));
      updateHiddenBar();
    }

    function updateHiddenBar() {
      const bar = document.getElementById("hiddenBar");
      const countEl = document.getElementById("hiddenCount");
      if (!bar || !countEl) return;
      const n = hiddenGames.size;
      if (n === 0) {
        bar.hidden = true;
        return;
      }
      bar.hidden = false;
      countEl.textContent = n === 1 ? "1 game hidden" : `${n} games hidden`;
    }

    function hideGame(gameId) {
      gameId = String(gameId);
      hiddenGames.add(gameId);
      persistHidden();
      const card = cardEls.get(gameId);
      if (card) {
        card.remove();
        // keep in cardEls so we can restore without logo flash
      }
      // Refresh section counts / empty sections
      refreshSectionVisibility();
    }

    function showAllHidden() {
      hiddenGames.clear();
      persistHidden();
      forceFullRender = false;
      fetchScores();
    }

    function refreshSectionVisibility() {
      for (const key of ["live", "upcoming", "final"]) {
        const section = content.querySelector(`section[data-section="${key}"]`);
        if (!section) continue;
        const grid = section.querySelector(".grid");
        const cards = grid ? grid.querySelectorAll(".card") : [];
        const countEl = section.querySelector(".count");
        if (countEl) countEl.textContent = String(cards.length);
        if (!cards.length) section.remove();
      }
      if (!content.querySelector("section") && !content.querySelector(".empty") && !content.querySelector(".error")) {
        // may still have games, just all hidden
        if (hiddenGames.size) {
          content.innerHTML = `<div class="empty">All visible games are hidden. Use “Show all” above to restore them.</div>`;
        }
      }
    }

    function logoUrl(team) {
      if (team.logo) return team.logo;
      if (team.logos && team.logos.length) {
        const preferred = team.logos.find(l => l.rel && l.rel.includes("default")) || team.logos[0];
        return preferred.href;
      }
      return `https://a.espncdn.com/i/teamlogos/ncaa/500/${team.id}.png`;
    }

    function rankBadgeHtml(competitor) {
      const r = competitor.curatedRank?.current;
      if (r && r <= 25) return `<span class="rank">#${r}</span>`;
      return "";
    }

    function overallRecord(competitor) {
      const recs = competitor.records || [];
      const overall = recs.find(r => r.type === "total") || recs.find(r => r.name === "overall");
      return overall?.summary || "";
    }

    function formatStatus(status, event) {
      if (!status) return { text: "", cls: "pre", startingSoon: false };
      const t = status.type || {};
      const state = t.state || "pre";
      let text = t.shortDetail || t.detail || t.description || "";
      let startingSoon = false;
      if (state === "in") {
        text = t.detail || t.shortDetail || "Live";
      } else if (state === "post") {
        text = "Final";
      } else if (state === "pre" && event?.date) {
        const kick = new Date(event.date);
        if (!Number.isNaN(kick.getTime())) {
          const mins = (kick.getTime() - Date.now()) / 60000;
          const timeStr = kick.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
          const now = new Date();
          const sameDay =
            kick.getFullYear() === now.getFullYear() &&
            kick.getMonth() === now.getMonth() &&
            kick.getDate() === now.getDate();
          const dateStr = sameDay
            ? "Today"
            : kick.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
          if (mins >= 0 && mins <= 30) {
            text = `Starting soon · ${timeStr}`;
            startingSoon = true;
          } else {
            text = `${dateStr} · ${timeStr}`;
          }
        }
      }
      return { text, cls: state, startingSoon };
    }

    function watchableScore(event) {
      const comp = event.competitions?.[0];
      if (!comp) return 0;
      const comps = comp.competitors || [];
      const scores = comps
        .map(c => parseInt(c.score, 10))
        .filter(n => !Number.isNaN(n));
      let score = 0;

      if (scores.length === 2) {
        const margin = Math.abs(scores[0] - scores[1]);
        // Closer games rank higher
        score += Math.max(0, 28 - margin * 2);
      }

      let rankedCount = 0;
      for (const c of comps) {
        const r = c.curatedRank?.current;
        if (r && r <= 25) {
          rankedCount += 1;
          score += Math.max(0, 14 - r * 0.4);
        }
      }
      if (rankedCount >= 2) score += 16;

      const period = comp.status?.period || 0;
      if (period >= 3) score += 4;
      if (period >= 4) score += 6;

      if (scores.length === 2 && period >= 4) {
        const margin = Math.abs(scores[0] - scores[1]);
        if (margin <= 8) score += 12;
        if (margin <= 3) score += 8;
      }

      if (comp.situation?.isRedZone) score += 6;

      return score;
    }

    function lineScoresFor(competitor) {
      const lines = competitor.linescores || [];
      // Map period -> displayValue
      const byPeriod = {};
      for (const ls of lines) {
        if (ls.period != null) byPeriod[ls.period] = ls.displayValue ?? String(ls.value ?? "");
      }
      return byPeriod;
    }

    function expandedPanelHtml(event, competitors, situation, isLive, isFinal) {
      // Quarter score table
      const maxPeriod = Math.max(
        4,
        ...competitors.flatMap(c => (c.linescores || []).map(ls => ls.period || 0))
      );
      const periods = [];
      for (let p = 1; p <= Math.min(maxPeriod, 6); p++) periods.push(p);

      const headerCells = periods.map(p => {
        if (p <= 4) return `<th>${p}</th>`;
        return `<th>OT${p - 4 > 1 ? p - 4 : ""}</th>`;
      }).join("") + `<th>T</th>`;

      // Away first (already sorted)
      const rows = competitors.map(c => {
        const byP = lineScoresFor(c);
        const cells = periods.map(p => `<td>${byP[p] != null && byP[p] !== "" ? byP[p] : "–"}</td>`).join("");
        const total = c.score != null && c.score !== "" ? c.score : "–";
        const abbr = c.team?.abbreviation || "?";
        return `<tr>
          <td class="team-cell">${abbr}</td>
          ${cells}
          <td class="total-cell">${total}</td>
        </tr>`;
      }).join("");

      const qtrTable = `
        <table class="qtr-table">
          <thead>
            <tr>
              <th></th>
              ${headerCells}
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      // Timeouts + win prob for live
      let meta = "";
      if (isLive && situation) {
        const away = competitors.find(c => c.homeAway === "away") || competitors[0];
        const home = competitors.find(c => c.homeAway === "home") || competitors[1];
        const awayTo = situation.awayTimeouts;
        const homeTo = situation.homeTimeouts;
        const toDots = (n) => {
          if (n == null) return "";
          const left = Math.max(0, Math.min(3, n));
          return `<span class="timeout-dots">${"●".repeat(left)}<span class="used">${"●".repeat(3 - left)}</span></span>`;
        };

        let toHtml = "";
        if (awayTo != null || homeTo != null) {
          toHtml = `<span>${away?.team?.abbreviation || "Away"} TO ${toDots(awayTo)}</span>
                    <span>${home?.team?.abbreviation || "Home"} TO ${toDots(homeTo)}</span>`;
        }

        const prob = situation.lastPlay?.probability;
        let wpHtml = "";
        if (prob && (prob.awayWinPercentage != null || prob.homeWinPercentage != null)) {
          const awayPct = Math.round((prob.awayWinPercentage || 0) * 100);
          const homePct = Math.round((prob.homeWinPercentage || 0) * 100);
          wpHtml = `
            <span style="display:flex;align-items:center;gap:8px;flex:1;min-width:160px;">
              <span>${away?.team?.abbreviation || "Away"} <strong>${awayPct}%</strong></span>
              <span class="wp-bar" title="Win probability">
                <span class="away-wp" style="width:${awayPct}%"></span>
                <span class="home-wp" style="width:${homePct}%"></span>
              </span>
              <span><strong>${homePct}%</strong> ${home?.team?.abbreviation || "Home"}</span>
            </span>`;
        }

        if (toHtml || wpHtml) {
          meta = `<div class="extra-meta">${toHtml}${wpHtml}</div>`;
        }
      }

      // For final / pre: show records more clearly is already on card; add venue if present
      let venueHtml = "";
      const venue = event.competitions?.[0]?.venue;
      if (venue?.fullName) {
        const loc = [venue.address?.city, venue.address?.state].filter(Boolean).join(", ");
        venueHtml = `<div class="extra-meta"><span>📍 ${escapeHtml(venue.fullName)}${loc ? " · " + escapeHtml(loc) : ""}</span></div>`;
      }

      return `<div class="expanded-panel">${qtrTable}${meta}${venueHtml}</div>`;
    }

    function sortLiveEvents(events) {
      if (!watchableSortOn) return events;
      return [...events].sort((a, b) => watchableScore(b) - watchableScore(a));
    }

    function networkText(competition) {
      const broadcasts = competition.broadcasts || [];
      if (!broadcasts.length) return "";
      const names = broadcasts.flatMap(b => b.names || []);
      return names[0] || "";
    }

    function gameLink(event) {
      const links = event.links || [];
      const gamecast = links.find(l => (l.rel || []).includes("live") || l.text === "Gamecast");
      if (gamecast) return gamecast.href;
      const box = links.find(l => (l.rel || []).includes("boxscore"));
      if (box) return box.href;
      return `https://www.espn.com/college-football/game?gameId=${event.id}`;
    }

    function boxScoreLink(event) {
      const links = event.links || [];
      const box = links.find(l => (l.rel || []).includes("boxscore") || l.text === "Box Score");
      if (box) return box.href;
      return `https://www.espn.com/college-football/boxscore/_/gameId/${event.id}`;
    }

    function formatSpread(odds) {
      if (!odds || !odds.length) return "";
      const o = odds[0];
      if (o.details) return o.details;
      const spread = o.spread;
      if (spread == null) return "";
      if (o.awayTeamOdds?.favorite) {
        return `${o.awayTeamOdds.team.abbreviation} -${Math.abs(spread)}`;
      }
      if (o.homeTeamOdds?.favorite) {
        return `${o.homeTeamOdds.team.abbreviation} -${Math.abs(spread)}`;
      }
      return `Spread ${spread}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sortedCompetitors(comp) {
      return [...(comp.competitors || [])].sort((a, b) => {
        if (a.homeAway === "away") return -1;
        if (b.homeAway === "away") return 1;
        return 0;
      });
    }

    function detectScoreChanges(event) {
      const comp = event.competitions?.[0];
      if (!comp) return { justScoredTeams: new Set(), anyScored: false };
      const gameId = event.id;
      const prev = prevScores.get(gameId) || {};
      const justScoredTeams = new Set();
      let anyScored = false;

      for (const c of comp.competitors || []) {
        const tid = String(c.team?.id);
        const score = parseInt(c.score, 10);
        if (Number.isNaN(score)) continue;
        const old = prev[tid];
        if (old != null && score > old) {
          justScoredTeams.add(tid);
          anyScored = true;
          recentScores.set(`${gameId}-${tid}`, Date.now());
        }
      }

      const now = Date.now();
      for (const c of comp.competitors || []) {
        const tid = String(c.team?.id);
        const key = `${gameId}-${tid}`;
        const ts = recentScores.get(key);
        if (ts && now - ts < 8000) {
          justScoredTeams.add(tid);
          anyScored = true;
        } else if (ts && now - ts >= 8000) {
          recentScores.delete(key);
        }
      }

      return { justScoredTeams, anyScored };
    }

    function updatePrevScores(event) {
      const comp = event.competitions?.[0];
      if (!comp) return;
      const map = {};
      for (const c of comp.competitors || []) {
        const tid = String(c.team?.id);
        const score = parseInt(c.score, 10);
        if (!Number.isNaN(score)) map[tid] = score;
      }
      prevScores.set(event.id, map);
    }

    function situationHtml(situation, competitors) {
      if (!situation) return "";
      const text = situation.downDistanceText || situation.shortDownDistanceText || "";
      const possId = situation.possession;
      let possAbbr = "";
      if (possId && competitors) {
        const team = competitors.find(c => String(c.team?.id) === String(possId));
        if (team) possAbbr = team.team.abbreviation || "";
      }
      const yard = situation.possessionText || "";
      const isRZ = !!situation.isRedZone;
      const parts = [];
      if (text) parts.push(text);
      if (yard && text && !text.includes(yard)) parts.push(yard);
      else if (yard && !text) parts.push(yard);
      if (!parts.length && !isRZ) return "";
      return `
        <div class="situation ${isRZ ? "redzone" : ""}">
          ${possAbbr ? `<span class="ball">● ${possAbbr}</span>` : ""}
          <span>${parts.join(" · ")}</span>
        </div>
      `;
    }

    function lastPlayHtml(situation) {
      const lp = situation?.lastPlay;
      if (!lp || !lp.text) return "";
      return `<div class="last-play"><strong>Last:</strong> ${escapeHtml(lp.text)}</div>`;
    }

    /**
     * Convert ESPN yard markers to 0–100 field position (0 = left end zone line,
     * 100 = right end zone line). Offense always drives left → right on our graphic.
     *
     * possessionText like "MISS 42" means the ball is on that team's 42.
     * If that team has the ball, they're on their own 42 (pos = 42 from their goal).
     * We always orient so the possessing team goes toward the right (higher %).
     */
    function parseYardText(text) {
      if (!text || typeof text !== "string") return null;
      const m = text.trim().match(/^(.+?)\s+(\d{1,2})$/);
      if (!m) return null;
      const yard = parseInt(m[2], 10);
      if (Number.isNaN(yard) || yard < 0 || yard > 50) return null;
      return { team: m[1].trim().toUpperCase(), yard };
    }

    function teamMatch(label, team) {
      if (!label || !team) return false;
      const t = label.toUpperCase();
      const abbr = (team.abbreviation || "").toUpperCase();
      const short = (team.shortDisplayName || "").toUpperCase();
      const loc = (team.location || "").toUpperCase();
      const name = (team.name || "").toUpperCase();
      if (abbr && (t === abbr || t.includes(abbr) || abbr.includes(t))) return true;
      if (short && (t === short || short.includes(t) || t.includes(short))) return true;
      if (loc && (t === loc || t.includes(loc))) return true;
      if (name && t.includes(name)) return true;
      return false;
    }

    /** Absolute field pos 0–100 from possessing team's own goal toward opponent goal. */
    function toAbsFromOwnGoal(parsed, possTeam, otherTeam) {
      if (!parsed) return null;
      if (teamMatch(parsed.team, possTeam?.team)) return parsed.yard;
      if (teamMatch(parsed.team, otherTeam?.team)) return 100 - parsed.yard;
      // Unknown side label: assume own side if <= 50 (standard)
      return parsed.yard;
    }

    function fieldPositions(situation, competitors) {
      if (!situation) return null;

      const possId = situation.possession != null ? String(situation.possession) : null;
      const list = competitors || [];
      let possTeam = possId ? list.find(c => String(c.team?.id) === possId) : null;
      let otherTeam = possId ? list.find(c => String(c.team?.id) !== possId) : null;
      // Fallback: if possession id missing, still try to draw using yardLine only
      if (!possTeam && list.length) {
        possTeam = list[0];
        otherTeam = list[1] || null;
      }
      if (!possTeam) return null;

      const possAbbr = (possTeam.team?.abbreviation || "?").toUpperCase();
      const otherAbbr = (otherTeam?.team?.abbreviation || "OPP").toUpperCase();

      let curAbs = null;
      const curParsed = parseYardText(situation.possessionText || "");
      curAbs = toAbsFromOwnGoal(curParsed, possTeam, otherTeam);

      if (curAbs == null && situation.yardLine != null) {
        const yl = Number(situation.yardLine);
        if (!Number.isNaN(yl)) {
          // ESPN yardLine is usually the number on the side named in possessionText;
          // without side info treat 0–50 as that many yards from own goal.
          curAbs = yl > 50 ? 100 - (100 - yl) : yl;
          if (yl > 50) curAbs = yl; // rare absolute
          curAbs = Math.max(0, Math.min(100, yl <= 50 ? yl : yl));
        }
      }

      // Final fallback so the field still appears for any live snap
      if (curAbs == null) curAbs = 50;
      curAbs = Math.max(0, Math.min(100, curAbs));

      let startAbs = null;
      const driveStartText = situation.lastPlay?.drive?.start?.text || "";
      const startParsed = parseYardText(driveStartText);
      startAbs = toAbsFromOwnGoal(startParsed, possTeam, otherTeam);

      // Ignore bogus "TEAM 0" start when drive has no real data
      const driveDesc = situation.lastPlay?.drive?.description || "";
      if (startAbs === 0 && /0 plays|0 yards/i.test(driveDesc)) {
        startAbs = null;
      }

      if (startAbs == null) {
        const ym = driveDesc.match(/(\d+)\s*yards?/i);
        if (ym) {
          const gained = parseInt(ym[1], 10);
          if (!Number.isNaN(gained) && gained > 0) {
            startAbs = Math.max(0, Math.min(100, curAbs - gained));
          }
        }
      }
      if (startAbs == null) startAbs = curAbs;
      startAbs = Math.max(0, Math.min(100, startAbs));

      return {
        start: startAbs,
        current: curAbs,
        possAbbr,
        otherAbbr,
        isRedZone: !!situation.isRedZone,
        label: situation.possessionText || situation.downDistanceText || ""
      };
    }

    function miniFieldHtml(situation, competitors) {
      const pos = fieldPositions(situation, competitors);
      if (!pos) return "";

      const a = Math.min(pos.start, pos.current);
      const b = Math.max(pos.start, pos.current);
      const left = a;
      const width = Math.max(b - a, 2);
      const ball = pos.current;

      return `
        <div class="mini-field" title="Drive: ${escapeHtml(pos.label)} (offense →)">
          <div class="mini-field-label">
            <span>${escapeHtml(pos.possAbbr)}</span>
            <span class="mini-field-mid">${escapeHtml(pos.label || (pos.current + " yd"))}</span>
            <span>${escapeHtml(pos.otherAbbr)}</span>
          </div>
          <div class="field-track">
            <div class="field-endzone left"></div>
            <div class="field-endzone right"></div>
            <div class="field-drive" style="left:${left}%;width:${width}%;"></div>
            <div class="field-start" style="left:${pos.start}%;"></div>
            <div class="field-ball" style="left:${ball}%;"></div>
          </div>
        </div>
      `;
    }

    function buildCardElement(event) {
      const wrap = document.createElement("div");
      wrap.innerHTML = createCardHtml(event);
      const el = wrap.firstElementChild;
      // Ensure logo onerror is bound without re-setting src later
      el.querySelectorAll("img.logo").forEach(img => {
        img.addEventListener("error", function onErr() {
          img.removeEventListener("error", onErr);
          const abbr = img.dataset.abbr || "?";
          const fb = document.createElement("div");
          fb.className = "logo fallback";
          fb.textContent = abbr.slice(0, 3);
          img.replaceWith(fb);
        });
      });
      return el;
    }

    function createCardHtml(event) {
      const comp = event.competitions?.[0];
      if (!comp) return "";

      const status = formatStatus(comp.status, event);
      const isLive = status.cls === "in";
      const isFinal = status.cls === "post";
      const situation = comp.situation;
      const possessionId = situation?.possession;
      const isRedZone = isLive && !!situation?.isRedZone;
      const { justScoredTeams, anyScored } = detectScoreChanges(event);
      const competitors = sortedCompetitors(comp);

      const teamRows = competitors.map(c => {
        const team = c.team || {};
        const tid = String(team.id);
        const score = c.score != null && c.score !== "" ? c.score : (status.cls === "pre" ? "" : "–");
        const isWinner = isFinal && c.winner === true;
        const isLoser = isFinal && c.winner === false;
        const scoreCls = [
          isWinner ? "winner" : "",
          isLoser ? "loser" : "",
          justScoredTeams.has(tid) ? "just-scored" : ""
        ].filter(Boolean).join(" ");
        const logo = logoUrl(team);
        const abbr = team.abbreviation || team.shortDisplayName || "?";
        const hasBall = isLive && possessionId && tid === String(possessionId);
        const rec = overallRecord(c);

        return `
          <div class="team-row" data-team-id="${tid}">
            <div class="logo-wrap">
              <img class="logo" src="${logo}" alt="" data-abbr="${abbr}" width="26" height="26" />
            </div>
            <div class="team-meta">
              <div class="team-name">
                ${hasBall ? '<span class="poss-indicator" title="Has possession"></span>' : '<span class="poss-spacer"></span>'}
                ${rankBadgeHtml(c)}
                <a class="name team-link" href="team.html?id=${tid}" title="${team.displayName || ""}">${team.shortDisplayName || team.location || team.name || abbr}</a>
                ${rec ? `<span class="record">(${rec})</span>` : ""}
              </div>
            </div>
            <div class="score-col">
              <span class="score ${scoreCls}">${score !== "" ? score : "–"}</span>
            </div>
          </div>
        `;
      }).join("");

      const spread = formatSpread(comp.odds);
      const href = gameLink(event);
      const boxHref = boxScoreLink(event);
      const cardClasses = [
        "card",
        isLive ? "live" : "",
        isRedZone ? "redzone" : "",
        anyScored ? "scored-flash" : ""
      ].filter(Boolean).join(" ");

      const hideBtn = isLive
        ? `<button type="button" class="hide-btn" title="Hide this game (avoid spoilers)" data-hide="${event.id}" aria-label="Hide game">✕</button>`
        : "";

      const linkLabel = isFinal ? "Box Score" : "Gamecast";
      const linkHref = isFinal ? boxHref : href;

      return `
        <article class="${cardClasses}" data-game-id="${event.id}">
          ${hideBtn}
          <div class="card-header">
            <div class="card-header-left">
              <span class="status ${status.cls}${status.startingSoon ? " starting-soon" : ""}">${status.text}</span>
              ${isRedZone ? '<span class="rz-badge">Red Zone</span>' : ''}
            </div>
            <span class="network">${networkText(comp)}</span>
          </div>
          <div class="teams">
            ${teamRows}
          </div>
          <div class="live-extras">
            ${isLive ? situationHtml(situation, competitors) : ""}
            ${isLive ? miniFieldHtml(situation, competitors) : ""}
            ${isLive ? lastPlayHtml(situation) : ""}
          </div>
          <div class="footer-row">
            <span class="spread">${spread ? `<span class="fav">${spread}</span>` : ""}</span>
            <a class="cast-link" href="${linkHref}" target="_blank" rel="noopener">${linkLabel} →</a>
          </div>
          ${expandedPanelHtml(event, competitors, situation, isLive, isFinal)}
        </article>
      `;
    }

    // Update an existing card without touching logo <img> elements
    function updateCardInPlace(card, event) {
      const comp = event.competitions?.[0];
      if (!comp) return;

      const status = formatStatus(comp.status, event);
      const isLive = status.cls === "in";
      const isFinal = status.cls === "post";
      const situation = comp.situation;
      const possessionId = situation?.possession;
      const isRedZone = isLive && !!situation?.isRedZone;
      const { justScoredTeams, anyScored } = detectScoreChanges(event);
      const competitors = sortedCompetitors(comp);

      // Classes
      card.classList.toggle("live", isLive);
      card.classList.toggle("redzone", isRedZone);
      if (anyScored) {
        card.classList.remove("scored-flash");
        // force reflow to restart animation if needed
        void card.offsetWidth;
        card.classList.add("scored-flash");
      } else {
        card.classList.remove("scored-flash");
      }

      // Header
      const statusEl = card.querySelector(".status");
      if (statusEl) {
        statusEl.textContent = status.text;
        statusEl.className = `status ${status.cls}${status.startingSoon ? " starting-soon" : ""}`;
      }
      let headerLeft = card.querySelector(".card-header-left");
      if (!headerLeft && statusEl) {
        // migrate older cards
        const header = card.querySelector(".card-header");
        if (header) {
          headerLeft = document.createElement("div");
          headerLeft.className = "card-header-left";
          statusEl.replaceWith(headerLeft);
          headerLeft.appendChild(statusEl);
        }
      }
      if (headerLeft) {
        let rz = headerLeft.querySelector(".rz-badge");
        if (isRedZone) {
          if (!rz) {
            rz = document.createElement("span");
            rz.className = "rz-badge";
            rz.textContent = "Red Zone";
            headerLeft.appendChild(rz);
          }
        } else if (rz) {
          rz.remove();
        }
      }
      const networkEl = card.querySelector(".network");
      if (networkEl) networkEl.textContent = networkText(comp);

      // Teams: update possession, record, score — never touch logo imgs
      const rows = card.querySelectorAll(".team-row");
      competitors.forEach((c, i) => {
        const row = rows[i];
        if (!row) return;
        const team = c.team || {};
        const tid = String(team.id);
        const scoreVal = c.score != null && c.score !== "" ? c.score : (status.cls === "pre" ? "" : "–");
        const isWinner = isFinal && c.winner === true;
        const isLoser = isFinal && c.winner === false;
        const hasBall = isLive && possessionId && tid === String(possessionId);
        const rec = overallRecord(c);

        // Possession indicator
        const nameRow = row.querySelector(".team-name");
        if (nameRow) {
          const first = nameRow.firstElementChild;
          const needPoss = hasBall;
          const isPoss = first && first.classList.contains("poss-indicator");
          const isSpacer = first && first.classList.contains("poss-spacer");
          if (needPoss && !isPoss) {
            const dot = document.createElement("span");
            dot.className = "poss-indicator";
            dot.title = "Has possession";
            if (first) first.replaceWith(dot);
            else nameRow.prepend(dot);
          } else if (!needPoss && !isSpacer) {
            const spacer = document.createElement("span");
            spacer.className = "poss-spacer";
            if (first && (first.classList.contains("poss-indicator"))) first.replaceWith(spacer);
            else if (!first) nameRow.prepend(spacer);
          }

          // Record
          let recEl = nameRow.querySelector(".record");
          if (rec) {
            if (!recEl) {
              recEl = document.createElement("span");
              recEl.className = "record";
              nameRow.appendChild(recEl);
            }
            recEl.textContent = `(${rec})`;
          } else if (recEl) {
            recEl.remove();
          }
        }

        // Score
        const scoreEl = row.querySelector(".score");
        if (scoreEl) {
          const display = scoreVal !== "" ? scoreVal : "–";
          const wasJust = scoreEl.classList.contains("just-scored");
          const shouldJust = justScoredTeams.has(tid);

          scoreEl.textContent = display;
          scoreEl.classList.toggle("winner", !!isWinner);
          scoreEl.classList.toggle("loser", !!isLoser);

          if (shouldJust && !wasJust) {
            scoreEl.classList.remove("just-scored");
            void scoreEl.offsetWidth;
            scoreEl.classList.add("just-scored");
          } else if (!shouldJust) {
            scoreEl.classList.remove("just-scored");
          }
        }
      });

      // Live extras (situation + last play)
      let extras = card.querySelector(".live-extras");
      if (!extras) {
        extras = document.createElement("div");
        extras.className = "live-extras";
        const footer = card.querySelector(".footer-row");
        if (footer) card.insertBefore(extras, footer);
        else card.appendChild(extras);
      }
      if (isLive) {
        extras.innerHTML =
          situationHtml(situation, competitors) +
          miniFieldHtml(situation, competitors) +
          lastPlayHtml(situation);
      } else {
        extras.innerHTML = "";
      }

      // Spread
      const spreadEl = card.querySelector(".spread");
      if (spreadEl) {
        const spread = formatSpread(comp.odds);
        spreadEl.innerHTML = spread ? `<span class="fav">${spread}</span>` : "";
      }

      // Footer link: Gamecast vs Box Score
      const castLink = card.querySelector(".cast-link");
      if (castLink) {
        const href = isFinal ? boxScoreLink(event) : gameLink(event);
        const label = isFinal ? "Box Score →" : "Gamecast →";
        if (castLink.getAttribute("href") !== href) castLink.setAttribute("href", href);
        if (castLink.textContent !== label) castLink.textContent = label;
      }

      // Expanded stats panel (shown via CSS when few cards in row)
      let exp = card.querySelector(".expanded-panel");
      const expHtml = expandedPanelHtml(event, competitors, situation, isLive, isFinal);
      if (exp) {
        exp.outerHTML = expHtml;
      } else {
        card.insertAdjacentHTML("beforeend", expHtml);
      }

      // Hide button only for live games
      let hideBtn = card.querySelector(".hide-btn");
      if (isLive) {
        if (!hideBtn) {
          hideBtn = document.createElement("button");
          hideBtn.type = "button";
          hideBtn.className = "hide-btn";
          hideBtn.title = "Hide this game (avoid spoilers)";
          hideBtn.setAttribute("aria-label", "Hide game");
          hideBtn.textContent = "✕";
          hideBtn.dataset.hide = String(event.id);
          card.insertBefore(hideBtn, card.firstChild);
        } else {
          hideBtn.dataset.hide = String(event.id);
        }
      } else if (hideBtn) {
        hideBtn.remove();
      }
    }

    function ensureSection(key, title, titleCls) {
      let section = content.querySelector(`section[data-section="${key}"]`);
      if (!section) {
        section = document.createElement("section");
        section.className = "section";
        section.dataset.section = key;
        const collapsible = key === "final";
        const chevron = collapsible ? `<span class="chevron">▼</span>` : "";
        section.innerHTML = `
          <div class="section-title ${titleCls}${collapsible ? " collapsible" : ""}" ${collapsible ? 'role="button" tabindex="0" aria-expanded="true"' : ""}>
            ${chevron}
            ${title}
            <span class="count">0</span>
          </div>
          <div class="grid"></div>
        `;
        // Insert in order: live, upcoming, final
        const order = ["live", "upcoming", "final"];
        const idx = order.indexOf(key);
        let inserted = false;
        for (let i = idx + 1; i < order.length; i++) {
          const next = content.querySelector(`section[data-section="${order[i]}"]`);
          if (next) {
            content.insertBefore(section, next);
            inserted = true;
            break;
          }
        }
        if (!inserted) content.appendChild(section);

        if (collapsible) {
          const titleEl = section.querySelector(".section-title");
          const applyCollapsed = (collapsed) => {
            section.classList.toggle("collapsed", collapsed);
            titleEl.setAttribute("aria-expanded", collapsed ? "false" : "true");
            localStorage.setItem("cfb-final-collapsed", collapsed ? "1" : "0");
          };
          // Restore preference
          if (localStorage.getItem("cfb-final-collapsed") === "1") {
            applyCollapsed(true);
          }
          titleEl.addEventListener("click", () => {
            applyCollapsed(!section.classList.contains("collapsed"));
          });
          titleEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              applyCollapsed(!section.classList.contains("collapsed"));
            }
          });
        }
      }
      return section;
    }

    function renderBoard(live, upcoming, final) {
      // Clear empty/error placeholders
      content.querySelectorAll(".empty, .error").forEach(el => el.remove());

      const groups = [
        { key: "live", title: "Live", cls: "live-title", events: live },
        { key: "upcoming", title: "Upcoming", cls: "upcoming-title", events: upcoming },
        { key: "final", title: "Final", cls: "final-title", events: final }
      ];

      const seenIds = new Set();

      for (const g of groups) {
        const visibleEvents = g.events.filter(e => !hiddenGames.has(String(e.id)));
        if (!visibleEvents.length) {
          const existing = content.querySelector(`section[data-section="${g.key}"]`);
          if (existing) existing.remove();
          // Still process events for in-memory card updates when all hidden
          for (const event of g.events) {
            const id = String(event.id);
            seenIds.add(id);
            if (!hiddenGames.has(id)) continue;
            let card = cardEls.get(id);
            if (card && forceFullRender) {
              card.remove();
              cardEls.delete(id);
              card = null;
            }
            if (!card) {
              card = buildCardElement(event);
              cardEls.set(id, card);
            } else {
              updateCardInPlace(card, event);
            }
            if (card.parentElement) card.parentElement.removeChild(card);
          }
          continue;
        }

        const section = ensureSection(g.key, g.title, g.cls);
        const grid = section.querySelector(".grid");
        const countEl = section.querySelector(".count");
        if (countEl) countEl.textContent = String(visibleEvents.length);

        // Track order of cards in this section
        const fragment = document.createDocumentFragment();
        const sectionCards = [];

        for (const event of g.events) {
          const id = String(event.id);
          seenIds.add(id);

          // Skip temporarily hidden games (spoiler protection)
          if (hiddenGames.has(id)) {
            // Still keep/update card in memory so restore is instant & logos stay cached
            let card = cardEls.get(id);
            if (card && forceFullRender) {
              card.remove();
              cardEls.delete(id);
              card = null;
            }
            if (!card) {
              card = buildCardElement(event);
              cardEls.set(id, card);
            } else {
              updateCardInPlace(card, event);
            }
            if (card.parentElement) card.parentElement.removeChild(card);
            continue;
          }

          let card = cardEls.get(id);
          if (card && forceFullRender) {
            // Group change etc. — rebuild
            card.remove();
            cardEls.delete(id);
            card = null;
          }

          if (!card) {
            card = buildCardElement(event);
            cardEls.set(id, card);
          } else {
            updateCardInPlace(card, event);
          }

          // Detach from old parent if moving sections
          if (card.parentElement && card.parentElement !== grid) {
            card.parentElement.removeChild(card);
          }
          sectionCards.push(card);
        }

        // Re-append in correct order (preserves existing nodes = no logo reload)
        for (const card of sectionCards) {
          fragment.appendChild(card);
        }
        grid.replaceChildren(fragment);
      }

      // Remove cards for games that disappeared
      for (const [id, card] of cardEls) {
        if (!seenIds.has(id)) {
          card.remove();
          cardEls.delete(id);
        }
      }

      // If nothing left
      if (!live.length && !upcoming.length && !final.length) {
        content.innerHTML = `<div class="empty">No games found for this selection.</div>`;
        cardEls.clear();
      }

      forceFullRender = false;
    }

    async function fetchScores() {
      const url = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?limit=150&groups=80";

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const events = data.events || [];

        const live = [];
        const upcoming = [];
        const final = [];

        for (const e of events) {
          const state = e.competitions?.[0]?.status?.type?.state || "pre";
          if (state === "in") live.push(e);
          else if (state === "post") final.push(e);
          else upcoming.push(e);
        }

        upcoming.sort((a, b) => new Date(a.date) - new Date(b.date));
        final.sort((a, b) => new Date(b.date) - new Date(a.date));
        const liveSorted = sortLiveEvents(live);

        renderBoard(liveSorted, upcoming, final);

        for (const e of events) updatePrevScores(e);

        liveDot.classList.toggle("live", live.length > 0);
        const now = new Date();
        updatedEl.textContent = `Updated ${now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })} · ${events.length} games`;
      } catch (err) {
        console.error(err);
        forceFullRender = true;
        cardEls.clear();
        content.innerHTML = `<div class="error">Failed to load scores. ${err.message}<br>Check your connection and try again.</div>`;
        updatedEl.textContent = "Error";
        liveDot.classList.remove("live");
      }
    }

    function startAutoRefresh() {
      if (timer) clearInterval(timer);
      timer = setInterval(fetchScores, REFRESH_MS);
    }

    refreshBtn.addEventListener("click", () => {
      fetchScores();
      startAutoRefresh();
    });

    const watchableToggle = document.getElementById("watchableToggle");
    function syncWatchableToggle() {
      if (!watchableToggle) return;
      watchableToggle.classList.toggle("toggle-on", watchableSortOn);
      watchableToggle.title = watchableSortOn
        ? "Watchable sort is ON — live games ordered by close / ranked / late"
        : "Sort live games by how watchable they are (close, ranked, late)";
      watchableToggle.textContent = watchableSortOn ? "Watchable sort · On" : "Watchable sort";
    }
    syncWatchableToggle();
    watchableToggle.addEventListener("click", () => {
      watchableSortOn = !watchableSortOn;
      localStorage.setItem("cfb-watchable-sort", watchableSortOn ? "1" : "0");
      syncWatchableToggle();
      fetchScores();
    });

    document.getElementById("showAllHidden").addEventListener("click", () => {
      showAllHidden();
    });

    // Event delegation for hide buttons (works for new + updated cards)
    content.addEventListener("click", (e) => {
      const btn = e.target.closest(".hide-btn");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      const id = btn.getAttribute("data-hide");
      if (id) hideGame(id);
    });

    updateHiddenBar();

    fetchScores();
    startAutoRefresh();

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (timer) clearInterval(timer);
      } else {
        fetchScores();
        startAutoRefresh();
      }
    });
  </script>
</body>
</html>
